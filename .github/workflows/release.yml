# Build Linux, Windows, and both Mac kinds from this source, then attach
# the packs to a GitHub release. A push to main refreshes the alpha release.
# A tag named v* publishes that tag as a prerelease. Weights and CUDA stay out.
name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: onnxruntime-linux-x64-1.22.0
            ext: tgz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: onnxruntime-win-x64-1.22.0
            ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: onnxruntime-osx-arm64-1.22.0
            ext: tgz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: onnxruntime-osx-x86_64-1.22.0
            ext: tgz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starlign
          key: ${{ matrix.target }}
      - name: Build
        working-directory: starlign
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack with ONNX Runtime 1.22
        shell: bash
        run: bash .github/pack-release.sh "${{ matrix.target }}" "${{ matrix.archive }}" "${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: starlign-${{ matrix.target }}
          path: starlign-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="alpha"
          fi
          printf '%s\n' \
            "Alpha build." \
            "" \
            "Linux, Windows, and both kinds of Mac. Each zip holds the tool and the official ONNX Runtime 1.22 CPU library in lib/. The speech weights are not in the zip. CUDA is not in the zip. Mac builds run on the CPU only." \
            > notes.md
          files=(dist/*/*.zip)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "expected 4 packs, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          if [ "$tag" = "alpha" ] && gh release view alpha >/dev/null 2>&1; then
            gh release delete alpha --yes --cleanup-tag
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --prerelease --target "${GITHUB_SHA}" --notes-file notes.md
          else
            gh release create "$tag" --prerelease --target "${GITHUB_SHA}" --title "$tag" --notes-file notes.md "${files[@]}"
          fi
