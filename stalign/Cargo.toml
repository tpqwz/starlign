[package]
name = "starlign"
version = "0.1.0"
edition = "2021"
description = "Standalone CTC audiobook aligner. One binary, ONNX Runtime, CUDA when the driver is there."
license = "MIT"
publish = false

[[bin]]
name = "starlign"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
any_ascii = "0.3.2"
clap = { version = "4.5", features = ["derive"] }
half = "2"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "half", "load-dynamic", "cuda", "api-22", "preload-dylibs"] }
quick-xml = "0.37"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "pcm", "vorbis", "wav"] }
unicode-segmentation = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "clipboard"] }
rfd = { version = "0.15.4", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
lto = "thin"
codegen-units = 1
